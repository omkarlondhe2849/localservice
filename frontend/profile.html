<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Book Your Service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="profile-page-body">
  <nav>
    <!-- Nav content is dynamically inserted by app.js -->
  </nav>

  <div class="profile-container">
    <div class="profile-header">
      <div class="profile-cover-photo"></div>
      <div class="profile-picture-container">
        <div class="profile-picture">
          <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="12" cy="7" r="4" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h1 id="profileName">Loading...</h1>
      </div>
      <div class="profile-actions">
        <button id="editProfileBtn" class="btn-primary">Edit Profile</button>
      </div>
    </div>

    <div class="profile-content">
      <div class="profile-details-card">
        <h2>About</h2>
        <p><strong>Email:</strong> <span id="profileEmail"></span></p>
        <p><strong>Phone:</strong> <span id="profilePhone"></span></p>
        <p><strong>Role:</strong> <span id="profileRole"></span></p>
      </div>
      <!-- Future sections for bookings/services can be added here -->
    </div>
  </div>

  <!-- Modal for editing profile -->
  <div id="editProfileModalOverlay" class="modal-overlay" style="display:none;"></div>
  <div id="editProfileModal" class="modal" style="display:none;"></div>

  <script src="app.js"></script>
</body>
</html>

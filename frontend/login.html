<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Book Your Service</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page-body">
  <div class="login-container">
    <div class="login-left">
      <h1 class="login-brand">book your service</h1>
      <p class="login-tagline">Connect with trusted local service providers for any job, big or small.</p>
    </div>
    <div class="login-right">
      <div class="login-box">
    <form id="loginForm">
          <input type="email" name="email" placeholder="Email address or phone number" required>
          <input type="password" name="password" placeholder="Password" required>
          <button type="submit" class="btn-login">Log In</button>
    </form>
        <a href="forgot-password.html" class="forgot-password-link">Forgotten password?</a>
        <hr class="login-divider">
        <a href="register.html" class="btn-create-account">Create new account</a>
      </div>
      <p class="create-page-link">
        <b><a href="register.html">Become a Provider</a></b> for your business or brand.
      </p>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
